name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: '6.8.3'

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run CI helper unit tests
        run: python3 -m unittest discover -s tools/ci/tests -p 'test_*.py'
      - name: Check shell syntax
        run: bash -n tools/ci/*.sh
      - name: List canonical CMake presets
        run: cmake --list-presets=all
      - name: Check repository whitespace
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$CI_EVENT_NAME" in
            pull_request)
              tools/ci/check-git-whitespace.sh pr "$CI_PR_BASE_SHA" "$CI_HEAD_SHA"
              ;;
            push)
              tools/ci/check-git-whitespace.sh push "$CI_BEFORE_SHA" "$CI_HEAD_SHA"
              ;;
            workflow_dispatch)
              tools/ci/check-git-whitespace.sh commit "$CI_HEAD_SHA"
              ;;
            *)
              echo "unsupported workflow event: $CI_EVENT_NAME" >&2
              exit 1
              ;;
          esac
      - name: Run actionlint when available
        run: |
          if command -v actionlint >/dev/null 2>&1; then
            actionlint .github/workflows/ci.yml
          else
            echo "actionlint is not installed; workflow structure and pins are checked manually."
          fi
      - name: Enforce workflow policy
        run: python3 tools/ci/check-workflow-policy.py .github/workflows/ci.yml

  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install stable Rust with quality components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Run Rust gate
        run: tools/ci/run-rust-gate.sh

  qml:
    name: qml
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang \
            g++ \
            libegl1-mesa-dev \
            libwayland-bin \
            libwayland-dev \
            libxkbcommon-dev \
            ninja-build \
            pkg-config \
            python3 \
            wayland-protocols
      # jurplel/install-qt-action v4.3.1
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qt5compat qtshadertools qtwayland
          install-deps: true
          cache: false
      - name: Verify Qt installation
        run: |
          test "$(qtpaths --qt-version)" = "$QT_VERSION"
          command -v qmllint
      - name: Build Qt 6 LayerShellQt
        run: |
          layer_shell_prefix="$RUNNER_TEMP/layer-shell-qt"
          bash tools/ci/install-layer-shell-qt.sh "$layer_shell_prefix"
          echo "CMAKE_PREFIX_PATH=$layer_shell_prefix${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run QML gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: tools/ci/run-qml-gate.sh

  cmake-matrix:
    name: cmake (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset:
          - debug
          - release
          - clang
          - asan
          - ubsan
          - no-typhon
          - no-layer-shell
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang \
            g++ \
            libegl1-mesa-dev \
            libwayland-bin \
            libwayland-dev \
            libxkbcommon-dev \
            ninja-build \
            pkg-config \
            python3 \
            wayland-protocols
      # jurplel/install-qt-action v4.3.1
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qt5compat qtshadertools qtwayland
          install-deps: true
          cache: false
      - name: Verify Qt installation
        run: |
          test "$(qtpaths --qt-version)" = "$QT_VERSION"
          command -v qmllint
      - name: Build Qt 6 LayerShellQt
        if: matrix.preset != 'no-layer-shell'
        run: |
          layer_shell_prefix="$RUNNER_TEMP/layer-shell-qt"
          bash tools/ci/install-layer-shell-qt.sh "$layer_shell_prefix"
          echo "CMAKE_PREFIX_PATH=$layer_shell_prefix${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run CMake gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: tools/ci/run-cmake-gate.sh "${{ matrix.preset }}"
      - name: Upload CMake diagnostics on failure
        if: ${{ failure() }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cmake-diagnostics-${{ matrix.preset }}-${{ github.run_id }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/${{ matrix.preset }}/ctest.junit.xml
            build/${{ matrix.preset }}/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 5
          compression-level: 0

  required:
    name: required
    if: ${{ always() }}
    needs:
      - policy
      - rust
      - qml
      - cmake-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all quality gates
        if: ${{ needs.policy.result != 'success' || needs.rust.result != 'success' || needs.qml.result != 'success' || needs.cmake-matrix.result != 'success' }}
        run: exit 1
      - name: Publish required result
        run: echo "CI / required passed"

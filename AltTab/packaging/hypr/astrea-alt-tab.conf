# Astrea Native Alt+Tab - Hyprland Integration
# Install this file to ~/.config/hypr/bindings/ or include from your main config.
#
# Usage:
#   include /path/to/astrea-alt-tab.conf
#
# Or define variables and bindings directly:
#   $altTabNext = astrea-alt-tab --next
#   $altTabPrevious = astrea-alt-tab --previous
#   $altTabCommit = astrea-alt-tab --commit
#   $altTabCancel = astrea-alt-tab --cancel
#
# NOTE: The modifier mask on bindr MUST include ALT for modifier-only release detection.

$altTabNext = astrea-alt-tab --next
$altTabPrevious = astrea-alt-tab --previous
$altTabCommit = astrea-alt-tab --commit
$altTabCancel = astrea-alt-tab --cancel

bind = ALT, Tab, exec, $altTabNext
bind = ALT SHIFT, Tab, exec, $altTabPrevious
bindr = ALT, Alt_L, exec, $altTabCommit
bindr = ALT, Alt_R, exec, $altTabCommit

# Blur rule for the Alt+Tab overlay:
# layerrule = blur on,           match:namespace astrea-alt-tab
# layerrule = ignore_alpha 0.05, match:namespace astrea-alt-tab

// Astrea Zen download prototype: local startup module in the isolated runtime.
(() => {
  const observer = () => {
    Services.obs.removeObserver(observer,"final-ui-startup");
    const directory = Services.dirsvc.get("GreD",Ci.nsIFile);
    directory.append("astrea-downloads");
    const resources = Services.io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler);
    resources.setSubstitution("astrea-downloads",Services.io.newFileURI(directory));
    ChromeUtils.importESModule("resource://astrea-downloads/ZenDownloadPublisher.sys.mjs").start().catch(error => {
      console.error("Astrea Zen Downloads startup:",error);
    });
  };
  Services.obs.addObserver(observer,"final-ui-startup");
})();

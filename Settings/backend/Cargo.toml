[package]
name = "astrea_settings_backend"
version = "0.1.0"
edition = "2024"
links = "astrea_settings_backend"
build = "build.rs"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
cxx = "1.0.95"
cxx-qt = "0.10.0"
cxx-qt-lib = "0.10.0"
astrea_system_backend = { path = "../../shared/backend" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cxx-qt-build = "0.10.0"

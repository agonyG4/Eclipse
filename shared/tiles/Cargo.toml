[package]
name = "astrea-app-tiles"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "macOS Tahoe squircle tiles for app icons an Astrea icon theme lacks"

[lib]
name = "astrea_app_tiles"
crate-type = ["staticlib", "lib"]

[dependencies]
# App artwork SVGs: Qt's SVG Tiny reader drops clip-path and more, so tiles
# rasterise SVG art here. No text or fonts: icons draw their glyphs as paths.
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }

[profile.release]
opt-level = 3
